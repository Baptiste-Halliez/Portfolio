<section class="detail {{cssClass}}">
  <div class="detail__project">
    <h1 class="detail__title">{{title}}</h1>
    <figure class="detail__content">
      <img src="{{projetImg}}" alt="" class="detail__img" />
      <figcaption class="detail__text">
        <h2 class="detail__sub">{{projetDesc}}</h2>
        <p class="detail__desc">{{description}}</p>
      </figcaption>
    </figure>
    <figure class="detail__content">
      <figcaption class="detail__text">
        <h2 class="detail__sub">{{projetConc}}</h2>
        <p class="detail__desc">{{concept}}</p>
      </figcaption>
      <img src="{{conceptImg}}" alt="" class="detail__img" />
    </figure>
    <figure class="detail__content">
      <img src="{{resultImg}}" alt="" class="detail__img" />
      <figcaption class="detail__text">
        <h2 class="detail__sub">{{projetResult}}</h2>
        <p class="detail__desc">
          {{result}}<a
            href="{{lienlink}}"
            target="_blank"
            rel="noopener"
            class="detail__link"
            >{{lien}}</a>
        </p>
      </figcaption>
    </figure>
    <a href="{{back}}" id="btn-retour" class="btn__retour"
      >{{btnRetour}}
      <svg class="icon arrowback">
        <use xlink:href="#icon-arrowback"></use>
      </svg>
    </a>
  </div>
  <svg
    width="16"
    height="16"
    viewBox="0 0 16 16"
    xmlns="http://www.w3.org/2000/svg"
    style="position: absolute; width: 0; height: 0; overflow: hidden"
    fill="none"
  >
    <symbol id="icon-arrowback">
      <path
        d="M10 2C11.3261 2 12.5979 2.52678 13.5356 3.46447C14.4732 4.40215 15 5.67392 15 7C15 8.32608 14.4732 9.59785 13.5356 10.5355C12.5979 11.4732 11.3261 12 10 12H4.41403L5.70703 13.293C5.80254 13.3852 5.87872 13.4956 5.93113 13.6176C5.98354 13.7396 6.01113 13.8708 6.01228 14.0036C6.01343 14.1364 5.98813 14.2681 5.93785 14.391C5.88757 14.5139 5.81332 14.6255 5.71943 14.7194C5.62553 14.8133 5.51388 14.8875 5.39098 14.9378C5.26809 14.9881 5.13641 15.0134 5.00363 15.0123C4.87085 15.0111 4.73963 14.9835 4.61763 14.9311C4.49562 14.8787 4.38528 14.8025 4.29303 14.707L1.29303 11.707C1.10556 11.5195 1.00024 11.2652 1.00024 11C1.00024 10.7348 1.10556 10.4805 1.29303 10.293L4.29303 7.293C4.48163 7.11084 4.73424 7.01005 4.99643 7.01233C5.25863 7.0146 5.50944 7.11977 5.69485 7.30518C5.88026 7.49059 5.98543 7.7414 5.9877 8.0036C5.98998 8.2658 5.88919 8.5184 5.70703 8.707L4.41403 10H10C10.7957 10 11.5587 9.68393 12.1214 9.12132C12.684 8.55871 13 7.79565 13 7C13 6.20435 12.684 5.44129 12.1214 4.87868C11.5587 4.31607 10.7957 4 10 4H5.00003C4.73481 4 4.48046 3.89464 4.29292 3.70711C4.10539 3.51957 4.00003 3.26522 4.00003 3C4.00003 2.73478 4.10539 2.48043 4.29292 2.29289C4.48046 2.10536 4.73481 2 5.00003 2H10Z"
