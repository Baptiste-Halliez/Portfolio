<section id="contact" class="contact">
  <div class="contact__content">
    <div class="contact__text">
      <p class="contact__sentence">
        {{p1}}<span class="contact__contact">{{contact}}</span>{{p2}}
      </p>
      <h3 class="contact__mail">{{mail}}</h3>
      <p class="contact__sub">{{ask}}</p>
    </div>
    <ul class="contact__socials">
      {{socials}}
    </ul>
  </div>
</section>
