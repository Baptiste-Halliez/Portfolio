<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Baptiste Halliez</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="icon" type="image/png" href="./assets/icons/PictoPortfolio.png">
  </head>
  <body>
    <div id="content"></div>

    <script type="module">
      import { Nav } from "./component/Navigation/index.js";
      import { NavigationData } from "./data/NavigationData.js";
      Nav.render("#content", NavigationData[0]);

      import { Hero } from "./component/Hero/index.js";
      import { HeroData } from "./data/HeroData.js";
      Hero.render("#content", HeroData[0]);

      import { SkillCard } from "./component/SkillCard/index.js";
      import { SkillCardData } from "./data/SkillCardData.js";

      import { Skill } from "./component/Skill/index.js";
      import { SkillData } from "./data/SkillData.js";
      Skill.addSkillCards(SkillCardData[0]);
      Skill.render("#content", SkillData[0]);

      let allcards = document.querySelectorAll(".skillcard");
      if (allcards.length >= 4) {
        allcards[0].classList.add("skillcard--ps");
        allcards[1].classList.add("skillcard--light");
        allcards[1].classList.add("skillcard--ai");
        allcards[2].classList.add("skillcard--vs");
        allcards[3].classList.add("skillcard--light");
        allcards[3].classList.add("skillcard--da");
        allcards[4].classList.add("skillcard--fi");
      }

      import { Realisation } from "./component/Realisation/index.js";
      import { RealisationData } from "./data/RealisationData.js";
      Realisation.render("#content", RealisationData[0]);

      import { Contact } from "./component/Contact/index.js";
      import { ContactData } from "./data/ContactData.js";
      Contact.render("#content", ContactData[0]);

      import { Footer } from "./component/Footer/index.js";
      import { FooterData } from "./data/FooterData.js";
      Footer.render("#content", FooterData[0]);
    </script>
  </body>
</html>
